apply plugin: 'com.android.application'

// Release signing: reads keystore.properties from the repo root (never commit it).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "top.yztz.gingerbulkmessenger"
    compileSdk = 36
    defaultConfig {
        applicationId "top.yztz.gingerbulkmessenger"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 26000309
        versionName "3.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
//        buildConfigField "long", "BUILD_TIME", "${System.currentTimeMillis()}L"
//        multiDexEnabled true
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
//            minifyEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        noCompress 'ttf', 'otf'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

}

// AGP 9 variant API: replaces the old applicationVariants.all { variant -> variant.outputs.all { ... } }
// block. Output file renaming now goes through androidComponents.onVariants using the
// ApplicationVariant/VariantOutputConfiguration APIs instead of the deprecated internal DSL.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def identifiers = output.filters.collect { it.identifier }
            def abi = identifiers.isEmpty() ? "universal" : identifiers.join("-")
            def typeSuffix = variant.buildType == 'release' ? "" : "-unsigned"
            // versionName is a lazy Property on the output (not available synchronously like the
            // old DSL), so build the file name via a provider mapping instead of a plain string.
            output.outputFileName.set(
                output.versionName.map { vn -> "GingerBulkMessenger-${vn}-${abi}${typeSuffix}.apk" }
            )
        }
    }
}

repositories {
    maven { url 'https://www.jitpack.io' }
}


